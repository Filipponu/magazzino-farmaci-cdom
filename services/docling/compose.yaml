services:
  docling:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DOCLING_API_TOKEN: ${DOCLING_API_TOKEN:?Set a random server secret}
    volumes:
      - jobs:/data
      - models:/models
    mem_limit: 6g
    cpus: 2
    security_opt: ["no-new-privileges:true"]
volumes:
  jobs:
  models:
